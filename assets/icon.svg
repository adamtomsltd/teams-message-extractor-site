<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)"/>
  
  <!-- Chat bubble icon -->
  <g transform="translate(64, 64)">
    <!-- Main bubble -->
    <path d="M-30 -20 Q-35 -20 -35 -15 L-35 15 Q-35 20 -30 20 L20 20 Q25 20 25 15 L25 -15 Q25 -20 20 -20 Z" 
          fill="white" opacity="0.95"/>
    <!-- Tail -->
    <path d="M15 20 L15 30 L25 20 Z" fill="white" opacity="0.95"/>
    
    <!-- Message lines -->
    <rect x="-25" y="-12" width="35" height="3" rx="1.5" fill="url(#bgGradient)" opacity="0.7"/>
    <rect x="-25" y="-4" width="40" height="3" rx="1.5" fill="url(#bgGradient)" opacity="0.7"/>
    <rect x="-25" y="4" width="30" height="3" rx="1.5" fill="url(#bgGradient)" opacity="0.7"/>
    
    <!-- CSV icon overlay -->
    <g transform="translate(10, 5)">
      <rect x="0" y="0" width="20" height="24" rx="2" fill="#4ade80" opacity="0.9"/>
      <text x="10" y="16" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
            text-anchor="middle" fill="white">CSV</text>
    </g>
  </g>
</svg>